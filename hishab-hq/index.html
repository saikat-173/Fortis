<title>Hishab HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
/* Layout: ink command rail on the left, one working canvas, edit drawer from the right. Phones get a bottom tab bar. */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#ECEEF3; --surface-3:#E2E6ED; --line:#DEE2EA; --line-2:#C8CFDB;
  --fg:#10162A; --muted:#566076; --faint:#8790A3;
  --accent:#2F55D4; --accent-ink:#FFFFFF; --accent-soft:#E3E9FC;
  --gold:#A8670C; --gold-soft:#F6EAD3;
  --good:#167A4A; --good-soft:#DCF1E5; --warn:#A5620E; --warn-soft:#F8EAD3; --bad:#B8361E; --bad-soft:#F8DFD8;
  --rail:#0D1322; --rail-fg:#D3DAE8; --rail-muted:#7A859C; --rail-hover:#182136; --rail-active:#1F2C52; --rail-accent:#A9BBFF;
  --hero:#0F172B; --hero-2:#18233D; --hero-fg:#F1F4FA; --hero-muted:#9AA6BF; --hero-line:#283553;
  --shadow:0 1px 2px rgba(16,22,42,.05),0 6px 20px rgba(16,22,42,.06);
  --shadow-lift:0 2px 4px rgba(16,22,42,.06),0 14px 34px rgba(16,22,42,.11);
  --font-display:"Bricolage Grotesque","Hind Siliguri",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Instrument Sans","Hind Siliguri",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono","Hind Siliguri",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E15; --surface:#121823; --surface-2:#192030; --surface-3:#212A3B; --line:#232C3C; --line-2:#334056;
  --fg:#E7EBF3; --muted:#9AA4B7; --faint:#6B7589;
  --accent:#8CA6FF; --accent-ink:#0A1433; --accent-soft:#1C2747;
  --gold:#E2AE55; --gold-soft:#33260F;
  --good:#5CC98D; --good-soft:#14301F; --warn:#E4A954; --warn-soft:#33270F; --bad:#F2866C; --bad-soft:#3A1C16;
  --rail:#070A10; --rail-fg:#D3DAE8; --rail-muted:#6E7891; --rail-hover:#121a2a; --rail-active:#1A2546; --rail-accent:#A9BBFF;
  --hero:#141D33; --hero-2:#1C2742; --hero-fg:#F1F4FA; --hero-muted:#9AA6BF; --hero-line:#2C3A5A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); --shadow-lift:0 2px 4px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E15; --surface:#121823; --surface-2:#192030; --surface-3:#212A3B; --line:#232C3C; --line-2:#334056;
  --fg:#E7EBF3; --muted:#9AA4B7; --faint:#6B7589;
  --accent:#8CA6FF; --accent-ink:#0A1433; --accent-soft:#1C2747;
  --gold:#E2AE55; --gold-soft:#33260F;
  --good:#5CC98D; --good-soft:#14301F; --warn:#E4A954; --warn-soft:#33270F; --bad:#F2866C; --bad-soft:#3A1C16;
  --rail:#070A10; --rail-fg:#D3DAE8; --rail-muted:#6E7891; --rail-hover:#121a2a; --rail-active:#1A2546; --rail-accent:#A9BBFF;
  --hero:#141D33; --hero-2:#1C2742; --hero-fg:#F1F4FA; --hero-muted:#9AA6BF; --hero-line:#2C3A5A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); --shadow-lift:0 2px 4px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);height:100%}
.rail{background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;gap:14px;padding:20px 12px 14px;overflow-y:auto;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 6px;border:0;background:none;color:inherit;text-align:left}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(155deg,#3D63E6,#1F3A9E);color:#fff;display:grid;place-items:center;font:800 17px/1 var(--font-display);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);flex:none}
.brand b{font:700 17px/1.1 var(--font-display);letter-spacing:-.01em;color:#fff;display:block}
.brand small{display:block;color:var(--rail-muted);font-size:11.5px;font-weight:500;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--rail-muted);padding:14px 10px 5px;font-weight:650}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--rail-fg);font-weight:500;font-size:14.5px;text-align:left;white-space:nowrap;opacity:.86}
.nav button:hover{background:var(--rail-hover);opacity:1}
.nav button[aria-current="page"]{background:var(--rail-active);color:#fff;opacity:1}
.nav button[aria-current="page"] svg{color:var(--rail-accent)}
.nav .count{margin-left:auto;font:500 11px var(--font-mono);color:var(--rail-muted)}
.nav .count.alert{color:#fff;background:#C0432A;border-radius:99px;padding:0 6px;min-width:18px;text-align:center}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--rail-hover)}
.rail-foot button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--rail-fg);padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:500;opacity:.85}
.rail-foot button:hover{background:var(--rail-hover);opacity:1}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--rail-muted);padding:4px 10px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--rail-muted)}
.sync.on i{background:#4CC283;box-shadow:0 0 0 3px rgba(76,194,131,.18)} .sync.local i{background:#E4A954}

.main{overflow-y:auto;min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:11px clamp(16px,3vw,36px)}
.top .mbrand{display:none}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--faint);cursor:text;text-align:left;min-width:0}
.search:hover{border-color:var(--line-2)}
.search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:500 11px var(--font-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--surface-2)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(47,85,212,.25)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ai{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:0;background:none;padding:7px;border-radius:8px;color:var(--muted);display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}

.page{padding-inline:clamp(16px,3vw,36px);padding-block:26px 72px;display:flex;flex-direction:column;gap:20px;max-width:1380px;animation:rise .28s ease-out}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h1{font:750 clamp(27px,3vw,36px)/1.04 var(--font-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.ph p{margin:7px 0 0;color:var(--muted);max-width:70ch}
.ph .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:650}

.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--gold-soft);border:1px solid color-mix(in oklab,var(--gold) 28%,transparent);border-radius:12px;padding:9px 14px;font-size:14px}
.banner b{color:var(--gold)}
.banner .btn{margin-left:auto}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;box-shadow:var(--shadow)}
.card > header{display:flex;align-items:center;gap:10px;padding:15px 18px 6px;flex-wrap:wrap}
.card > header h2{font:700 16.5px/1.2 var(--font-display);margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card > header h2 svg{color:var(--faint)}
.card > header .more{margin-left:auto}
.card .body{padding:6px 18px 18px}
.clickable{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--line-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}

/* hero */
.hero{background:radial-gradient(120% 140% at 100% 0%,var(--hero-2) 0%,var(--hero) 55%);color:var(--hero-fg);border-radius:18px;padding:26px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:18px 18px;mask-image:linear-gradient(90deg,transparent 40%,#000);-webkit-mask-image:linear-gradient(90deg,transparent 40%,#000);pointer-events:none}
.hero > *{position:relative;z-index:1;min-width:0}
.hero .eyebrow{color:var(--hero-muted)}
.hero h1{font:750 clamp(28px,3.4vw,40px)/1.04 var(--font-display);letter-spacing:-.03em;margin:6px 0 8px;text-wrap:balance}
.hero p{margin:0;color:var(--hero-muted);max-width:62ch;font-size:15px}
.hero p b{color:var(--hero-fg);font-weight:600}
.hero p b.bad{color:#FF9C85}
.stagebox{margin-top:18px;background:rgba(255,255,255,.06);border:1px solid var(--hero-line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;max-width:560px;cursor:pointer;transition:background .15s}
.stagebox:hover{background:rgba(255,255,255,.09)}
.stagebox .top2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stagebox .sn{font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:#E9C17A}
.stagebox b{font:700 17px var(--font-display)}
.stagebox .sm{font-size:12.5px;color:var(--hero-muted);margin-left:auto}
.stagebox .bar{background:rgba(255,255,255,.1)}
.stagebox .bar > i{background:linear-gradient(90deg,#E9C17A,#F4D9A4)}
.health{display:flex;gap:20px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .val b{font:800 36px/1 var(--font-display);letter-spacing:-.03em}
.ring .val small{font-size:11px;color:var(--hero-muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-top:3px}
.factors{display:flex;flex-direction:column;gap:9px;min-width:190px}
.factor{display:grid;grid-template-columns:86px 1fr 30px;gap:9px;align-items:center;font-size:12.5px;color:var(--hero-muted)}
.factor span:last-child{text-align:right;font-family:var(--font-mono);color:var(--hero-fg)}
.factor .bar{height:6px;background:rgba(255,255,255,.1)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .l svg{color:var(--faint)}
.kpi .v{font:600 clamp(23px,2.3vw,30px)/1.1 var(--font-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12.5px;color:var(--faint)}
.kpi .s.good{color:var(--good)} .kpi .s.bad{color:var(--bad)} .kpi .s.warn{color:var(--warn)}
.kpi .spark{position:absolute;right:12px;top:14px;width:84px;height:30px}
.kpi .spark path.a{fill:color-mix(in oklab,var(--good) 18%,transparent)} .kpi .spark path.l{fill:none;stroke:var(--good);stroke-width:1.6}
.kpi .spark circle{fill:var(--good)}
.kpi.cta{cursor:pointer;border-style:dashed}
.kpi.cta:hover{border-color:var(--accent)}

/* chips & pills */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;color:color-mix(in oklab,var(--c) 72%,var(--fg));background:color-mix(in oklab,var(--c) 13%,transparent);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.due.over{color:var(--bad);font-weight:650} .due.soon{color:var(--warn);font-weight:650}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:700 10px var(--font-body);color:#fff;background:var(--c);flex:none}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;min-width:0;border-radius:8px}
.rows .row:first-child{border-top-color:transparent}
.row:hover{background:var(--surface-2)}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font:500 14px var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--good)} .amt.out{color:var(--bad)}
.datechip{width:46px;flex:none;text-align:center;border:1px solid var(--line);border-radius:9px;padding:3px 0;line-height:1.05;background:var(--surface)}
.datechip b{display:block;font:700 16px var(--font-display)}
.datechip small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
.datechip.over{border-color:color-mix(in oklab,var(--bad) 50%,transparent);color:var(--bad)}
.datechip.over small{color:var(--bad)}
.check{width:20px;height:20px;flex:none;border-radius:6px;border:1.6px solid var(--line-2);background:var(--surface);display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--good)}
.check.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.check svg{width:13px;height:13px;stroke-width:3}
.star{border:0;background:none;padding:2px;color:var(--line-2);display:grid;place-items:center;border-radius:6px;flex:none}
.star:hover{color:var(--gold)}
.star.on{color:var(--gold)}
.star.on svg{fill:currentColor}
.done-t{text-decoration:line-through;color:var(--faint)}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.bucket{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--faint);padding:14px 6px 4px;display:flex;gap:8px}
.bucket span{margin-left:auto;font:500 12px var(--font-mono);letter-spacing:0;text-transform:none;color:var(--muted)}
.bucket.bad{color:var(--bad)}
.quick{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:4px 4px 4px 12px;margin-bottom:6px}
.quick:focus-within{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.quick input{flex:1;border:0;background:none;outline:none;padding:6px 0;min-width:0}
.qhint{font-size:12px;color:var(--faint);margin:-2px 0 0 2px}
.qhint code{font-family:var(--font-mono);font-size:11.5px;background:var(--surface-2);padding:0 4px;border-radius:4px;color:var(--muted)}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--surface-2);position:relative}
.bar > i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar > i.good{background:var(--good)} .bar > i.warn{background:var(--warn)} .bar > i.bad{background:var(--bad)} .bar > i.gold{background:var(--gold)}
.bar > em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.5;border-radius:2px}

/* board */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:650;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:650;color:var(--muted)}
.fchip:hover{border-color:var(--line-2)}
.fchip[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(256px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:170px;outline:2px dashed transparent;outline-offset:-2px;transition:outline-color .15s}
.col.over{outline-color:var(--accent)}
.col h3{display:flex;align-items:center;gap:8px;margin:2px 4px 4px;font:700 13.5px var(--font-display)}
.col h3 i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--faint))}
.col h3 span{font:500 12px var(--font-mono);color:var(--faint)}
.col h3 .add{margin-left:auto}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s,border-color .15s}
.tcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.tcard.dragging{opacity:.45}
.tcard .tt{display:flex;gap:9px;align-items:flex-start;font-weight:600;font-size:14px;line-height:1.35}
.tcard .tt > span{flex:1;min-width:0;overflow-wrap:anywhere}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

.mini .lrow{display:grid;grid-template-columns:92px 1fr 28px;gap:10px;align-items:center;font-size:13px}

/* target/project cards */

.stg .node::after{content:"";flex:1;height:3px;background:var(--line);margin-left:-2px;border-radius:2px}

const Store={
  recs:new Map(), mode:"pending", col:null, chains:new Map(), queued:new Set(),
  all(kind){return [...this.recs.values()].filter(r=>r.kind===kind)},
  get(id){return this.recs.get(id)},
  save(rec,quiet){
    rec.updatedAt=Date.now(); if(!rec.createdAt) rec.createdAt=rec.updatedAt;
    Object.keys(rec).forEach(k=>rec[k]===undefined&&delete rec[k]);
    this.recs.set(rec.id,rec); this.persist(rec.id); if(!quiet)render();
  },
  remove(id){this.recs.delete(id); this.persist(id,true); render()},
  persist(id,del){
    if(this.mode==="db"){
      const run=()=>{const ref=this.col.doc(id);const r=this.recs.get(id);return del||!r?ref.delete():ref.set(JSON.parse(JSON.stringify(r)))};
      const p=(this.chains.get(id)||Promise.resolve()).then(run).catch(e=>{
        if(e&&e.code==="unavailable") return new Promise(r=>setTimeout(r,600+Math.random()*600)).then(run);
        throw e;
      }).catch(e=>toast(e&&e.code==="quota_exceeded"?"Storage is full. Delete old entries to add more.":"Couldn't save. Check your connection and try again."));
      this.chains.set(id,p);
    } else if(this.mode==="local"){ this.saveLocal(); }
    else this.queued.add(id);
  },
  saveLocal(){try{localStorage.setItem("hishabhq.v1",JSON.stringify([...this.recs.values()]))}catch(e){}},
  loadLocal(){try{const a=JSON.parse(localStorage.getItem("hishabhq.v1")||"[]");a.forEach(r=>this.recs.set(r.id,r))}catch(e){}},
};
const settings=()=>Store.get("settings")||{id:"settings",kind:"settings",currency:"BDT",style:"lakh"};
const CUR={BDT:"৳",USD:"$",EUR:"€",INR:"₹",GBP:"£"};
function money(n,compact){
  n=+n||0; const s=settings(), sym=CUR[s.currency]||"", neg=n<0?"−":""; n=Math.abs(n);
  if(compact){
    const L=s.style!=="intl";
    const steps=L?[[1e7,"Cr"],[1e5,"L"],[1e3,"K"]]:[[1e9,"B"],[1e6,"M"],[1e3,"K"]];
    for(const[v,u]of steps) if(n>=v){const x=n/v;return neg+sym+(x>=100?Math.round(x):+x.toFixed(x>=10?1:2))+u}
  }
  return neg+sym+new Intl.NumberFormat(s.style!=="intl"?"en-IN":"en-US",{maximumFractionDigits:0}).format(n);
}
const fmtUnit=(t,v,c)=>t.unit==="money"?money(v,c):t.unit==="percent"?(+v||0)+"%":new Intl.NumberFormat().format(+v||0);

const chip=a=>{const x=AREAS[a];return x?`<span class="chip" style="--c:${x.c}">${esc(x.l)}</span>`:""};
const dueTxt=(s,done)=>{if(!s)return"";const d=days(s);let c="",t=fmtD(s);
  if(!done){if(d<0){c="over";t=d===-1?"Yesterday":-d+"d overdue"}else if(d===0){c="soon";t="Today"}else if(d===1){c="soon";t="Tomorrow"}else if(d<=6)c="soon"}
  return `<span class="due ${c}">${t}</span>`};
const txnState=t=>t.status==="done"?"done":t.date<today()?"overdue":"pending";
function targetState(t){
  const p=t.goal?clamp((+t.current||0)/t.goal,0,1):0;
  if(p>=1) return {p,pace:1,cls:"good",label:"Hit"};
  const s=parseD(t.start||iso(new Date(t.createdAt||Date.now()))), e=parseD(t.deadline);
  let pace=0; if(e&&e>s) pace=clamp((parseD(today())-s)/(e-s),0,1);
  if(e&&parseD(today())>e) return {p,pace:1,cls:"bad",label:"Missed"};
  if(p>=pace-0.05) return {p,pace,cls:"good",label:"On track"};
  if(p>=pace-0.2) return {p,pace,cls:"warn",label:"At risk"};
  return {p,pace,cls:"bad",label:"Behind"};
}
function projectProgress(p){const ts=Store.all("task").filter(t=>t.projectId===p.id);if(!ts.length)return{p:clamp((+p.progress||0)/100,0,1),n:0,d:0};const d=ts.filter(t=>t.status==="done").length;return{p:d/ts.length,n:ts.length,d}}
function nextDue(s,f){const d=parseD(s||today());({daily:()=>d.setDate(d.getDate()+1),weekly:()=>d.setDate(d.getDate()+7),monthly:()=>d.setMonth(d.getMonth()+1),quarterly:()=>d.setMonth(d.getMonth()+3),yearly:()=>d.setFullYear(d.getFullYear()+1)})[f||"monthly"]();return iso(d)}
const stagesSorted=()=>Store.all("stage").sort((a,b)=>(a.start||"").localeCompare(b.start||""));
const stageColor=id=>{const i=stagesSorted().findIndex(s=>s.id===id);return STAGE_C[(i<0?0:i)%STAGE_C.length]};
const gateProg=s=>{const g=s.gates||[];const d=g.filter(x=>x.done).length;return{d,n:g.length,p:g.length?d/g.length:0}};
function currentStage(){const ss=stagesSorted();return ss.find(s=>s.status==="current")||ss.find(s=>s.status!=="done")||ss[ss.length-1]}
const riskScore=r=>(+r.likelihood||3)*(+r.impact||3);
const riskColor=s=>s>=15?"var(--bad)":s>=8?"var(--warn)":"var(--good)";
function cashStats(){
  const t=today(), outs=Store.all("txn").filter(x=>x.dir==="out"), from=addDays(t,-90);
  const paid=sum(outs.filter(x=>x.status==="done"&&(x.doneOn||x.date)>=from&&(x.doneOn||x.date)<=t));
  let burn=paid/3; if(!burn) burn=sum(outs.filter(x=>x.status!=="done"&&x.date<=addDays(t,30)));
  const s=settings(), cash=s.cash!=null&&s.cash!==""?+s.cash:null;
  return {burn,cash,runway:cash!=null&&burn>0?cash/burn:null};
}
function health(){
  const t=today(), f=[];
  const tg=Store.all("target"); if(tg.length) f.push(["Targets",tg.filter(x=>targetState(x).cls==="good").length/tg.length]);
  const pin=Store.all("txn").filter(x=>x.dir==="in"&&x.status!=="done"); if(pin.length&&sum(pin)) f.push(["Collections",1-sum(pin.filter(x=>x.date<t))/sum(pin)]);
  const ot=Store.all("task").filter(x=>x.status!=="done"); if(ot.length) f.push(["Execution",1-ot.filter(x=>x.due&&x.due<t).length/ot.length]);
  const {runway}=cashStats(); if(runway!=null) f.push(["Runway",clamp(runway/12,0,1)]);
  const rk=Store.all("risk").filter(r=>r.status!=="closed"); if(rk.length) f.push(["Risk",clamp(1-rk.filter(r=>riskScore(r)>=15).length*0.25-rk.filter(r=>riskScore(r)>=8&&riskScore(r)<15).length*0.08,0,1)]);
  const score=f.length?Math.round(f.reduce((s,x)=>s+x[1],0)/f.length*100):null;
  return {score,f};
}

function spark(vals){
  const max=Math.max(1,...vals),W=84,H=30,n=vals.length;if(n<2)return"";
  const pts=vals.map((v,i)=>[i*(W-4)/(n-1)+2,H-3-(v/max)*(H-8)]);
  const l="M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L"), last=pts[n-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path class="a" d="${l}L${W-2} ${H}L2 ${H}Z"/><path class="l" d="${l}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6"/></svg>`;
}
function monthKeys(back,fwd){const now=new Date(),a=[];for(let i=-back;i<=fwd;i++){const m=new Date(now.getFullYear(),now.getMonth()+i,1);a.push(m.getFullYear()+"-"+pad(m.getMonth()+1))}return a}
function ring(score){
  const r=52,c=2*Math.PI*r,p=score==null?0:score/100;
  const col=score==null?"#5D6A86":score>=75?"#4CC283":score>=50?"#E9B04F":"#F07A5E";
  return `<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}"/></svg><div class="val"><b>${score==null?"—":score}</b><small>Health</small></div></div>`;
}

/* parse "Call bank tomorrow !high #finance @Rafi" */
function parseQuick(s){
  const o={};const DOW=["sun","mon","tue","wed","thu","fri","sat"];
  s=s.replace(/(^|\s)#([\w&]+)/g,(m,p,a)=>{a=a.toLowerCase();const k=Object.keys(AREAS).find(k=>k===a||AREAS[k].l.toLowerCase().startsWith(a));if(k){o.area=k;return p}return m});
  s=s.replace(/(^|\s)!(high|medium|med|low|h|m|l)\b/i,(m,p,x)=>{o.priority={h:"high",high:"high",m:"med",med:"med",medium:"med",l:"low",low:"low"}[x.toLowerCase()];return p});
  s=s.replace(/(^|\s)@(\w+)/,(m,p,x)=>{o.owner=x;return p});
  s=s.replace(/(^|\s)(today|tomorrow|tmrw|next week|in (\d+) days?|mon(?:day)?|tue(?:s|sday)?|wed(?:nesday)?|thu(?:rs|rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)\b/i,(m,p,w,n)=>{
    const lw=w.toLowerCase(),t=today(),dw=/^(mon|tue|wed|thu|fri|sat|sun)/.test(lw)?lw:null;
    if(lw==="today")o.due=t;else if(lw==="tomorrow"||lw==="tmrw")o.due=addDays(t,1);else if(lw==="next week")o.due=addDays(t,7);
    else if(n)o.due=addDays(t,+n);else if(dw){const target=DOW.indexOf(dw.toLowerCase().slice(0,3));let d=(target-new Date().getDay()+7)%7;if(d===0)d=7;o.due=addDays(t,d)}
    return p});
  o.title=s.replace(/\s+/g," ").trim();return o;
}

function gantt(){
  const ss=stagesSorted().filter(s=>s.start&&s.end), pj=Store.all("project").filter(p=>p.start&&p.end).sort((a,b)=>a.start.localeCompare(b.start)), ms=Store.all("milestone").filter(m=>m.date);
  const dates=[...ss.flatMap(s=>[s.start,s.end]),...pj.flatMap(p=>[p.start,p.end]),...ms.map(m=>m.date),today()].sort();
  const s0=parseD(dates[0]), s1=parseD(dates[dates.length-1]);
  const start=new Date(s0.getFullYear(),s0.getMonth(),1); let end=new Date(s1.getFullYear(),s1.getMonth()+1,1);
  if((end-start)/864e5<330) end=new Date(start.getFullYear(),start.getMonth()+12,1);
  const months=[];for(let d=new Date(start);d<end;d.setMonth(d.getMonth()+1))months.push(new Date(d));
  const CW=72, W=months.length*CW, span=end-start, x=s=>((parseD(s)-start)/span)*W;
  const head=`<div class="g-head"><div class="g-lab">Plan</div><div class="g-tr" style="width:${W}px;height:34px">${months.map((m,i)=>`<div class="g-m" style="left:${i*CW}px;width:${CW}px">${MON[m.getMonth()]}${m.getMonth()===0||i===0?" "+String(m.getFullYear()).slice(2):""}</div>`).join("")}</div></div>`;
  const grid=months.map((m,i)=>`<div class="g-m" style="left:${i*CW}px;width:${CW}px;padding:0"></div>`).join("");
  const row=(lab,inner,sec)=>`<div class="g-row ${sec?"g-sec":""}"><div class="g-lab" title="${esc(lab)}">${esc(lab)}</div><div class="g-tr" style="width:${W}px;height:${sec?26:38}px">${sec?"":grid}${inner}</div></div>`;
  const bar=(r,c,p,ghost)=>{const l=x(r.start),w=Math.max(10,x(r.end)-l);return `<div class="g-bar ${ghost?"ghost":""}" data-open="${r.id}" style="--c:${c};left:${l}px;width:${w}px" title="${esc(r.title)} · ${fmtD(r.start)} – ${fmtD(r.end)}">${p!=null&&!ghost?`<i style="width:${p*100}%"></i>`:""}<span style="position:relative">${esc(r.title)}</span></div>`};
  const dia=m=>`<div class="g-dia ${m.status==="done"?"done":""}" data-open="${m.id}" style="left:${x(m.date)}px" title="${esc(m.title)} · ${fmtD(m.date)}"></div>`;
  let rows="";
  if(ss.length){rows+=row("Company stages","",1);stagesSorted().forEach((s,i)=>{if(s.start&&s.end)rows+=row(s.title,bar(s,STAGE_C[i%STAGE_C.length],gateProg(s).p,s.status==="upcoming")+ms.filter(m=>m.stageId===s.id).map(dia).join(""))})}
  const loose=ms.filter(m=>!m.stageId||!Store.get(m.stageId)); if(loose.length) rows+=row("Other milestones",loose.map(dia).join(""));
  if(pj.length){rows+=row("Projects","",1);pj.forEach(p=>{rows+=row(p.title,bar(p,AREAS[p.area]?.c||"#2563EB",projectProgress(p).p,p.status==="planning"))})}
  return `<div class="gantt"><div class="g-in" style="width:${W+190}px">${head}${rows}<div class="g-today" style="left:${190+x(today())}px"><span>Today</span></div></div></div>`;
}

/* ---- calendar ---- */
function calEvents(){
  const ev=[];const push=(date,l,c,id,done)=>date&&ev.push({date,l,c,id,done});
  Store.all("task").forEach(t=>push(t.due,t.title,"#2F55D4",t.id,t.status==="done"));
  Store.all("txn").forEach(t=>push(t.status==="done"?(t.doneOn||t.date):t.date,(t.dir==="in"?"+":"−")+money(t.amount,true)+" "+t.title,t.dir==="in"?"#15803D":"#B8361E",t.id,t.status==="done"));
  Store.all("ops").forEach(o=>push(o.nextDue,o.title,"#0891B2",o.id));
  Store.all("milestone").forEach(m=>push(m.date,"◆ "+m.title,"#B7791F",m.id,m.status==="done"));
  Store.all("target").forEach(t=>push(t.deadline,"Target: "+t.title,"#7C3AED",t.id));
  Store.all("project").forEach(p=>push(p.end,"Deadline: "+p.title,"#2563EB",p.id,p.status==="done"));
  Store.all("decision").filter(d=>d.status!=="decided").forEach(d=>push(d.due,"Decide: "+d.title,"#BE185D",d.id));
  Store.all("experiment").forEach(e=>push(e.due,"Review: "+e.title,"#C026D3",e.id));
  return ev;
}

function cashChart(){
  const ms=monthKeys(2,3), txns=Store.all("txn"), key=x=>(x.status==="done"?(x.doneOn||x.date):x.date).slice(0,7);
  const data=ms.map(m=>{const a=txns.filter(x=>key(x)===m);return{m,recv:sum(a.filter(x=>x.dir==="in"&&x.status==="done")),exp:sum(a.filter(x=>x.dir==="in"&&x.status!=="done")),out:sum(a.filter(x=>x.dir==="out"))}});
  const max=Math.max(1,...data.map(d=>Math.max(d.recv+d.exp,d.out)));
  const mag=Math.pow(10,Math.floor(Math.log10(max))), nice=([1,2,2.5,5,10].map(f=>f*mag).find(v=>v*4>=max)||max/4)*4;
  const W=680,H=250,pl=58,pr=10,pt=12,pb=30,gw=(W-pl-pr)/ms.length,bw=Math.min(28,gw*.28),y=v=>pt+(H-pt-pb)*(1-v/nice);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in and out by month">`;
  const cm=today().slice(0,7), ci=ms.indexOf(cm);
  s+=`<rect class="curband" x="${pl+ci*gw}" y="${pt}" width="${gw}" height="${H-pt-pb}" rx="6"/>`;
  for(let i=0;i<=4;i++){const v=nice*i/4;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${esc(money(v,true))}</text>`}
  data.forEach((d,i)=>{const cx=pl+gw*i+gw/2,x1=cx-bw-2,x2=cx+2;
    s+=`<rect class="recv" x="${x1}" y="${y(d.recv)}" width="${bw}" height="${y(0)-y(d.recv)}" rx="3"><title>Received ${esc(money(d.recv))}</title></rect>`;
    s+=`<rect class="exp" x="${x1}" y="${y(d.recv+d.exp)}" width="${bw}" height="${y(0)-y(d.exp)}" rx="3"><title>Expected ${esc(money(d.exp))}</title></rect>`;
    s+=`<rect class="out" x="${x2}" y="${y(d.out)}" width="${bw}" height="${y(0)-y(d.out)}" rx="3"><title>Out ${esc(money(d.out))}</title></rect>`;
    const [yy,mm]=d.m.split("-");s+=`<text class="${d.m===cm?"cur":""}" x="${cx}" y="${H-10}" text-anchor="middle">${MON[+mm-1]}${mm==="01"?" "+yy.slice(2):""}</text>`});
  return s+"</svg>";
}
function forecast(){
  const {cash}=cashStats(); if(cash==null) return null;
  const t=today(), pend=Store.all("txn").filter(x=>x.status!=="done");
  let bal=cash-sum(pend.filter(x=>x.dir==="out"&&x.date<t));
  const pts=[{w:0,date:t,bal}];
  for(let w=1;w<=13;w++){
    const a=addDays(t,(w-1)*7),b=addDays(t,w*7);
    bal+=sum(pend.filter(x=>x.date>=a&&x.date<b),x=>(x.dir==="in"?1:-1)*(+x.amount||0));
    pts.push({w,date:b,bal});
  }
  const lo=pts.reduce((m,p)=>p.bal<m.bal?p:m,pts[0]);
  const vals=pts.map(p=>p.bal), mx=Math.max(...vals,0)*1.08, mn=Math.min(...vals,0), rng=(mx-mn)||1;
  const W=680,H=230,pl=58,pr=14,pt=22,pb=30, x=i=>pl+i*(W-pl-pr)/13, y=v=>pt+(H-pt-pb)*(1-(v-mn)/rng);
  const line="M"+pts.map((p,i)=>x(i).toFixed(1)+" "+y(p.bal).toFixed(1)).join("L");
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="13-week cash forecast">`;
  for(let i=0;i<=4;i++){const v=mn+rng*i/4;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${esc(money(v,true))}</text>`}
  if(mn<0) s+=`<line class="zero" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/>`;
  s+=`<path class="farea" d="${line}L${x(13)} ${y(Math.max(mn,0))}L${x(0)} ${y(Math.max(mn,0))}Z"/><path class="fline" d="${line}"/>`;
  pts.forEach((p,i)=>{if(i%2===0)s+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${i===0?"Now":"W"+i}</text>`});
  s+=`<circle class="fdot" cx="${x(13)}" cy="${y(pts[13].bal)}" r="4.5"/><text class="lbl" x="${x(13)-6}" y="${y(pts[13].bal)-10}" text-anchor="end">${esc(money(pts[13].bal,true))}</text>`;
  if(lo.w>0&&lo.w<13) s+=`<circle class="ldot" cx="${x(lo.w)}" cy="${y(lo.bal)}" r="4.5"/><text class="lbl" x="${x(lo.w)}" y="${Math.min(H-34,y(lo.bal)+20)}" text-anchor="middle">Low ${esc(money(lo.bal,true))}</text>`;
  return {svg:s+"</svg>",lo,end:pts[13].bal};
}

function md(s){
  const lines=esc(s).split("\n"),out=[];let list=null;
  const inline=x=>x.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  for(const l of lines){const m=l.match(/^\s*(?:[-*•]|(\d+)[.)])\s+(.*)/);
    if(m){const t=m[1]?"ol":"ul";if(!list||list.t!==t){if(list)out.push(`</${list.t}>`);list={t};out.push(`<${t}>`)}out.push(`<li>${inline(m[2])}</li>`);continue}
    if(list&&l.trim()){out.push(`</${list.t}>`);list=null}
    const h=l.match(/^#{1,4}\s+(.*)/);if(h){out.push(`<h4>${inline(h[1])}</h4>`);continue}
    if(l.trim())out.push(`<p>${inline(l)}</p>`)}
  if(list)out.push(`</${list.t}>`);return out.join("");
}

    <div class="f"><label for="s_style">Big numbers</label><select id="s_style"><option value="lakh" ${s.style!=="intl"?"selected":""}>Lakh / crore (12.5L, 1.2Cr)</option><option value="intl" ${s.style==="intl"?"selected":""}>Thousand / million (1.25M)</option></select></div>
    <p style="margin:0;color:var(--muted);font-size:13px">${Store.mode==="db"?"Your data is saved to your Claude account and syncs across your devices.":"Your data is saved in this browser only."}</p>
    <div class="eyebrow" style="margin-top:6px">Keyboard shortcuts</div>
    <div class="meta" style="gap:14px"><span><kbd>Ctrl K</kbd> search</span><span><kbd>N</kbd> new</span><span><kbd>A</kbd> ask AI</span><span><kbd>G</kbd> <kbd>R</kbd> roadmap</span><span><kbd>G</kbd> <kbd>H</kbd> hishab</span><span><kbd>G</kbd> <kbd>T</kbd> tasks</span><span><kbd>Esc</kbd> close</span></div>
    <div class="eyebrow" style="margin-top:6px">Backup</div>
    <div class="f"><textarea id="s_json" rows="5" placeholder="Paste a backup here to import it" aria-label="Backup"></textarea><span class="hint">Copy a backup of everything, or paste one and press Import.</span></div>
    <div class="toolbar"><button class="btn sm" type="button" data-act="export">Copy backup</button><button class="btn sm" type="button" data-act="import">Import</button><button class="btn sm" type="button" data-act="clear-examples">Clear example data</button><button class="btn sm danger" type="button" data-act="wipe">Delete everything</button></div>
  </form><footer><div class="spacer"></div><button class="btn primary" type="button" data-act="close">Done</button></footer>`;
  showDrawer();
  const save=()=>{const c=$("#s_cash").value;Store.save({...settings(),companyName:$("#s_co").value.trim(),ownerName:$("#s_me").value.trim(),cash:c===""?null:parseFloat(c),currency:$("#s_cur").value,style:$("#s_style").value})};
  $$("#sform input:not(#s_json),#sform select").forEach(el=>el.addEventListener("change",save));
}

/* ================= events ================= */
let toastT;
function toast(m,action){const t=$("#toast");t.innerHTML=`<span>${esc(m)}</span>${action?`<button type="button" id="toastAct">${esc(action.l)}</button>`:""}`;t.classList.toggle("act",!!action);t.classList.add("on");
  if(action)$("#toastAct").onclick=()=>{action.fn();t.classList.remove("on")};clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),action?5000:2200)}
function arm(btn,label,fn){if(btn.classList.contains("armed")){fn();return}btn.classList.add("armed");const old=btn.innerHTML;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){btn.classList.remove("armed");btn.innerHTML=old}},3500)}
const upd=(id,patch)=>{const r=Store.get(id);if(!r)return null;const n={...JSON.parse(JSON.stringify(r)),...patch};delete n.example;Store.save(n);return n};

document.addEventListener("click",e=>{
  const pi=e.target.closest("[data-pi]");if(pi){const it=palItems[+pi.dataset.pi];closePalette();it&&it.run();return}
  const a=e.target.closest("[data-act]");
  if(!a||(a.dataset.act==="cal-day"&&e.target.closest("[data-open]"))){const o=e.target.closest("[data-open]");if(o){const r=Store.get(o.dataset.open);r&&openDrawer(r.kind,r.id)}
    if(!e.target.closest("#menu"))closeMenu();return}
  const act=a.dataset.act, id=a.dataset.id; e.stopPropagation();
  if(act!=="quickadd"&&act!=="more")closeMenu();
  switch(act){
    case "go": if($("#drawer").classList.contains("on"))closeDrawer();go(a.dataset.view);break;
    case "add": closePalette();openDrawer(a.dataset.kind,null,a.dataset.def?JSON.parse(a.dataset.def):null);break;
    case "edit": {const r=Store.get(id);r&&openDrawer(r.kind,id);break}
    case "quickadd": $("#menu")?closeMenu():openMenu(a,addMenu());break;
    case "more": $("#menu")?closeMenu():openMenu(a,viewMenu());break;
    case "palette": openPalette();break;
    case "close": closeDrawer();break;
    case "settings": openSettings();break;
    case "del": arm(a,"Confirm delete",()=>{const r=drawerRec.rec;const snap=Store.get(r.id);Store.remove(r.id);closeDrawer();toast(KINDS[r.kind].l+" deleted",{l:"Undo",fn:()=>Store.save(snap)})});break;
    case "recv":{const r=upd(id,{status:"done",doneOn:today()});if(r)toast(r.dir==="in"?"Marked received: "+money(r.amount,true):"Marked paid",{l:"Undo",fn:()=>upd(id,{status:"pending",doneOn:undefined})});break}
    case "task-toggle":{const r=Store.get(id);if(!r)break;const done=r.status!=="done";upd(id,{status:done?"done":"todo",doneOn:done?today():undefined});if(done)toast("Done: "+trunc(r.title,40),{l:"Undo",fn:()=>upd(id,{status:r.status,doneOn:undefined})});break}
    case "focus":{const r=Store.get(id);if(!r)break;upd(id,{focus:!r.focus});toast(r.focus?"Removed from today's focus":"Added to today's focus");break}
    case "ops-done":{const r=Store.get(id),prev={nextDue:r.nextDue,lastDone:r.lastDone};const n=upd(id,{lastDone:today(),nextDue:nextDue(r.nextDue<today()?today():r.nextDue,r.freq)});toast("Next due "+fmtD(n.nextDue),{l:"Undo",fn:()=>upd(id,prev)});break}
    case "obj-toggle": case "gate-toggle":{const f=act==="obj-toggle"?"objectives":"gates";const r=JSON.parse(JSON.stringify(Store.get(id)));const o=r[f][+a.dataset.i];o.done=!o.done;upd(id,{[f]:r[f]});if(f==="gates"&&o.done&&r.gates.every(g=>g.done))toast("All exit criteria met. You can move to the next stage.");break}
    case "ms-toggle":{const r=Store.get(id);upd(id,{status:r.status==="done"?"pending":"done"});if(r.status!=="done")toast("Milestone achieved: "+trunc(r.title,40));break}
    case "stage-sel": ui.stageSel=id;render();break;
    case "stage-advance":{const ss=stagesSorted(),i=ss.findIndex(s=>s.id===id);upd(id,{status:"done"});if(ss[i+1]){upd(ss[i+1].id,{status:"current"});ui.stageSel=ss[i+1].id;toast("Welcome to "+ss[i+1].title)}else toast("Stage complete");break}
    case "task-mode": ui.taskMode=a.dataset.v;try{localStorage.setItem("hishabhq.taskMode",ui.taskMode)}catch(_){}render();break;
    case "task-area": ui.taskArea=a.dataset.v;render();break;
    case "plan-area": ui.planArea=a.dataset.v;render();break;
    case "dec-tab": ui.decTab=a.dataset.v;render();break;
    case "risk-cell": ui.riskCell=a.dataset.v&&ui.riskCell!==a.dataset.v?a.dataset.v:null;render();break;
    case "h-filter": ui.hFilter=a.dataset.v;render();break;
    case "cal-nav":{const v=+a.dataset.v;if(!v){ui.calMonth=today().slice(0,7);ui.calDay=today()}else{const[y,m]=ui.calMonth.split("-").map(Number);const d=new Date(y,m-1+v,1);ui.calMonth=d.getFullYear()+"-"+pad(d.getMonth()+1);ui.calDay=ui.calMonth+"-01"}render();break}
    case "cal-day": ui.calDay=a.dataset.v;render();break;
    case "ai": openAI("ask");break;
    case "ai-mode": openAI(a.dataset.v);break;
    case "ai-preset": aiAsk(AI_PRESETS[+a.dataset.i][1]);break;
    case "ai-stop": aiCtl?.abort();break;
    case "ai-tasks": openAI("tasks",id);break;
    case "ai-gen": aiTasks();break;
    case "ai-add":{const pj=$("#aiProj")?.value||undefined;let n=0;$$("[data-gi]").forEach(cb=>{if(!cb.checked)return;const x=aiGen[+cb.dataset.gi];Store.save({id:uid(),kind:"task",title:String(x.title).slice(0,140),area:AREAS[x.area]?x.area:"business",priority:["high","med","low"].includes(x.priority)?x.priority:"med",status:"todo",due:addDays(today(),clamp(Math.round(+x.dueInDays)||7,0,730)),owner:x.owner?String(x.owner).slice(0,40):undefined,projectId:pj},true);n++});render();closeDrawer();toast(`Added ${n} tasks`);break}
    case "clear-examples":{const ex=[...Store.recs.values()].filter(r=>r.example);ex.forEach(r=>{Store.recs.delete(r.id);Store.persist(r.id,true)});ui.stageSel=null;render();toast(ex.length?`Removed ${ex.length} example entries`:"No example data left");break}
    case "export":{const txt=JSON.stringify([...Store.recs.values()],null,1);const ta=$("#s_json");ta.value=txt;
      if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>toast("Backup copied"),()=>{ta.select();toast("Backup is in the box. Copy it from there.")});else{ta.select();toast("Backup is in the box. Copy it from there.")}break}
    case "import":{try{const arr=JSON.parse($("#s_json").value);if(!Array.isArray(arr))throw 0;let n=0;arr.forEach(r=>{if(r&&r.id&&r.kind&&/^[A-Za-z0-9_\-.~:@+]+$/.test(r.id)){Store.recs.set(r.id,r);Store.persist(r.id);n++}});render();toast(`Imported ${n} entries`)}catch(_){toast("That backup isn't valid. Paste the full text from Copy backup.")}break}
    case "wipe": arm(a,"Click again to delete everything",()=>{[...Store.recs.keys()].forEach(k=>{Store.recs.delete(k);Store.persist(k,true)});render();closeDrawer();toast("All data deleted")});break;
  }
});
document.addEventListener("submit",e=>{
  if(e.target.id==="dform")return submitDrawer(e);
  if(e.target.id==="aiForm"){e.preventDefault();const q=$("#aiQ").value.trim();if(q){$("#aiQ").value="";aiAsk(q)}return}
  if(e.target.dataset.quick!==undefined){e.preventDefault();const inp=e.target.q,v=inp.value.trim();if(!v)return;
    const o=parseQuick(v);if(!o.title)return;const defs=JSON.parse(e.target.dataset.quick||"{}");
    const rec={id:uid(),kind:"task",status:"todo",priority:"med",area:"business",...defs,...o};
    Store.save(rec);inp.value="";toast("Task added"+(rec.due?" · due "+fmtD(rec.due):""),{l:"Undo",fn:()=>Store.remove(rec.id)})}
});
document.addEventListener("change",e=>{const c=e.target.dataset?.cur;if(c){upd(c,{current:parseFloat(e.target.value)||0});toast("Progress updated")}});
$("#scrim").addEventListener("click",()=>{closePalette();closeDrawer()});
let gKey=0;
document.addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"");
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#pal")?closePalette():openPalette();return}
  if(e.key==="Escape"){if($("#pal"))closePalette();else if($("#menu"))closeMenu();else closeDrawer();return}
  if($("#pal")){if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();palSel=(palSel+(e.key==="ArrowDown"?1:-1)+palItems.length)%Math.max(1,palItems.length);palList();$("#pall .sel")?.scrollIntoView({block:"nearest"})}
    else if(e.key==="Enter"){e.preventDefault();const it=palItems[palSel];closePalette();it&&it.run()}return}
  if((e.key==="Enter"||e.key===" ")&&!typing&&document.activeElement?.matches?.("[role=button]")){e.preventDefault();document.activeElement.click();return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey||$("#drawer").classList.contains("on"))return;
  const k=e.key.toLowerCase();
  if(gKey&&Date.now()-gKey<900){gKey=0;const map={c:"overview",r:"roadmap",k:"calendar",p:"plans",t:"tasks",h:"hishab",d:"decisions",i:"invest"};if(map[k]){e.preventDefault();go(map[k])}return}
  if(k==="g"){gKey=Date.now();return}
  if(e.key==="/"){e.preventDefault();openPalette()}
  else if(k==="n"){e.preventDefault();openMenu($("#qaBtn"),addMenu())}
  else if(k==="a"&&Caps.sample){e.preventDefault();openAI("ask")}
});
/* drag & drop */
document.addEventListener("dragstart",e=>{const c=e.target.closest?.("[data-drag]");if(!c)return;e.dataTransfer.setData("text/plain",c.dataset.drag);e.dataTransfer.effectAllowed="move";c.classList.add("dragging")});
document.addEventListener("dragend",e=>{e.target.classList?.remove("dragging");$$(".col.over").forEach(c=>c.classList.remove("over"))});
document.addEventListener("dragover",e=>{const col=e.target.closest?.("[data-drop]");if(!col)return;e.preventDefault();$$(".col.over").forEach(c=>c!==col&&c.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",e=>{const col=e.target.closest?.("[data-drop]");if(!col)return;e.preventDefault();const id=e.dataTransfer.getData("text/plain"),r=Store.get(id);if(!r)return;const f=col.dataset.drop,v=col.dataset.v;if(r[f]===v){render();return}const p={[f]:v};if(r.kind==="task")p.doneOn=v==="done"?today():undefined;upd(id,p)});

/* ================= boot ================= */
function setSync(mode){const s=$("#sync");s.className="sync "+(mode==="db"?"on":mode==="local"?"local":"");s.querySelector("span").textContent=mode==="db"?"Synced to your account":mode==="local"?"Saved in this browser":"Connecting…"}
function useLocal(){if(Store.mode!=="pending")return;Store.mode="local";const pend=new Map(Store.recs);Store.loadLocal();pend.forEach((r,k)=>Store.recs.set(k,r));Store.saveLocal();setSync("local");render()}
render();
(async()=>{
  const use=n=>window.claude&&window.claude.use?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
  use("sample").then(s=>{if(s){Caps.sample=s;$("#aiBtn").hidden=false;render()}});
  const db=await use("db");
  if(!db){useLocal();return}
  try{
    Store.col=db.collection("records");
    let first=true;
    Store.col.onSnapshot(snap=>{
      const local=new Map([...Store.recs].filter(([k])=>Store.queued.has(k)));
      Store.recs=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));
      if(first){first=false;Store.mode="db";setSync("db");local.forEach((r,k)=>{Store.recs.set(k,r);Store.persist(k)});Store.queued.clear()}
      render();
    },()=>{if(Store.mode==="pending")useLocal();else toast("Live sync stopped. Reload the page to reconnect.")});
  }catch(e){useLocal()}
})();
</script>
